services:
  # PHP 8.4 Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scotus-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - scotus-network
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - OLLAMA_BASE_URL=http://ollama:11434
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: scotus-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - scotus-network

  # Ollama for Local LLM
  ollama:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    container_name: scotus-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - scotus-network
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODEL=llama3.2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: scotus-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - scotus-network

  # MySQL Database (backup option)
  mysql:
    image: mysql:8.0
    container_name: scotus-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: scotus
      MYSQL_ROOT_PASSWORD: scotus_pass
      MYSQL_PASSWORD: scotus_pass
      MYSQL_USER: scotus_user
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - scotus-network

# Docker Networks
networks:
  scotus-network:
    driver: bridge

# Persistent Volumes
volumes:
  ollama_data:
    driver: local
  redis_data:
    driver: local
  mysql_data:
    driver: local
